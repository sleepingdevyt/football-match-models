# ==============================================================================
#  ESPACIOS DE BUSQUEDA DE OPTUNA - MODELOS DE DISTRIBUCION
#  Consumido por: src/hypertunning/distribution_tuning.py :: suggest_params
#
#  FORMATO (una entrada por hiperparametro):
#    type   : int | float | categorical
#    low/high : rango (int y float)
#    step   : opcional, solo int/float
#    log    : opcional, escala logaritmica (solo float)
#    choices: lista de opciones (solo categorical)
#
#  No incluir aqui parametros fijos (random_state, verbose, natural_gradient):
#  esos vienen de 'models.<nombre>.params' en <target>_config.yaml.
# ==============================================================================

NGBoost:
  max_depth:
    type: int
    low: 2
    high: 6
  min_samples_leaf:
    type: int
    low: 5
    high: 50
  n_estimators:
    type: int
    low: 100
    high: 2000
    step: 50
  learning_rate:
    type: float
    low: 0.005
    high: 0.1
    log: true
  col_sample:
    type: float
    low: 0.5
    high: 1.0

LightGBMLSS:
  learning_rate:
    type: float
    low: 0.005
    high: 0.1
    log: true
  num_leaves:
    type: int
    low: 15
    high: 127
  max_depth:
    type: int
    low: 3
    high: 8
  min_child_samples:
    type: int
    low: 10
    high: 100
  feature_fraction:
    type: float
    low: 0.5
    high: 1.0
  bagging_fraction:
    type: float
    low: 0.6
    high: 1.0

XGBoostLSS:
  learning_rate:
    type: float
    low: 0.005
    high: 0.1
    log: true
  max_depth:
    type: int
    low: 3
    high: 8
  min_child_weight:
    type: int
    low: 1
    high: 50
  colsample_bytree:
    type: float
    low: 0.5
    high: 1.0
  subsample:
    type: float
    low: 0.6
    high: 1.0
