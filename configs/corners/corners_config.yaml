# ==============================================================================
#  CONFIGURACION - MODELO DE DISTRIBUCION DE GOLES
#  Consumido por: src/config/config.py :: load_config
#
#  Para reutilizar este pipeline con otro target (corners, tarjetas, tiros...):
#  copiar este archivo a configs/<target>/<target>_config.yaml y cambiar
#  'target.name', 'target.components[*].column' y 'target.thresholds'.
#  El resto del pipeline no requiere cambios de codigo.
# ==============================================================================

target:
  name: corners

  # Las dos variables que se suman para formar el mercado Over/Under.
  # 'key' identifica el componente en los resultados; 'column' es la columna real.
  components:
    - key: home
      column: "home_total_corners"
    - key: away
      column: "away_total_corners"

  # Grilla Over/Under a evaluar en el ECE.
  thresholds: [1.5, 2.5, 3.5, 4.5, 5.5, 6.5, 7.5, 8.5, 9.5, 10.5, 11.5, 12.5, 13.5, 14.5]

  # Maximo de la grilla discreta [0, max_k] para CDF/RPS.
  max_k: 15

  # Como se obtiene la distribucion del total (suma de los dos componentes):
  #   convolution    -> exacto bajo independencia, valido para Poisson y NegBin
  #   poisson_approx -> Poisson(mu_a + mu_b); replica el comportamiento anterior
  total_method: convolution

# Familias de distribucion a comparar.
distributions: [poisson, negbin]

# ── Validacion cruzada temporal ───────────────────────────────────────────────
cv:
  n_splits: 5
  random_state: 67

# ── Guardas numericas aplicadas a los parametros predichos ────────────────────
# Evitan NaN/inf y valores degenerados antes de calcular las metricas.
numeric_guards:
  mu_min: 1.0e-6
  alpha_min: 1.0e-6
  alpha_max: 100.0

# ── Hiperparametros base de cada modelo ───────────────────────────────────────
models:

  LightGBMLSS:
    params:
      boosting: gbdt
      learning_rate: 0.01
      num_leaves: 31
      max_depth: 5
      feature_fraction: 0.7
      bagging_fraction: 0.8
      min_child_samples: 50
      lambda_l1: 1
      lambda_l2: 5
      min_gain_to_split: 0.02
      verbose: -1
      seed: 67
    fit_params:
      num_boost_round: 2500
      early_stopping_rounds: 100

  XGBoostLSS:
    params:
      learning_rate: 0.01
      max_depth: 4
      colsample_bytree: 0.7
      subsample: 0.8
      min_child_weight: 5
      reg_alpha: 1
      reg_lambda: 5
      gamma: 0.02
      verbosity: 0
      seed: 67
    fit_params:
      num_boost_round: 2500
      early_stopping_rounds: 100

  NGBoost:
    params:
      n_estimators: 2000
      learning_rate: 0.01
      col_sample: 0.7
      minibatch_frac: 0.8
      max_depth: 5
      min_samples_leaf: 50
      random_state: 67
      natural_gradient: true
      verbose: false
    fit_params:
      early_stopping_rounds: 100

# ── Parametros especificos de la distribucion NegBin en los modelos LSS ───────
negbin_kwargs:
  stabilization: L2
  response_fn_total_count: relu
  response_fn_probs: sigmoid

# ── Test de razon de verosimilitud (Poisson vs NegBin) ────────────────────────
likelihood_ratio_test:
  alpha: 0.01     # nivel de significancia (one-sided; alpha esta en el borde)

# ── Tuning con Optuna ─────────────────────────────────────────────────────────
tuning:
  n_trials: 100
  n_splits: 5
  direction: minimize
  metric: nll            # metrica que Optuna minimiza
  random_state: 67
  search_spaces_file: optuna_search_spaces.yaml
  pruner:
    n_startup_trials: 10
    n_warmup_steps: 2
    interval_steps: 1

# ── Seleccion de features (pipeline Poisson) ──────────────────────────────────
# Consumido por: PoissonSelectionConfig.from_model_config(cfg)
# Las claves son exactamente los campos de esa dataclass; una clave desconocida
# aborta con error en vez de caer en silencio al default.
feature_selection:
  # Paralelismo: pocos threads por modelo y muchos modelos en paralelo rinde
  # 3-5x mas que all-threads con datasets de pocos miles de filas.
  n_jobs: 0                       # 0 -> cores // threads_per_model
  threads_per_model: 2

  # STEP 0
  sparsity_threshold: 0.95
  nan_threshold: 0.95
  explicit_categorical: null      # declarar aca IDs/codigos numericos

  # STEP 0.5 — leakage. No desactivar en la primera corrida.
  run_leakage_audit: true
  leakage_top_n: 40
  leakage_dev_reduction_flag: 0.15

  # STEP 1
  mi_threshold: 0.01
  mi_n_seeds: 3

  # STEP 2 — 0.70 deja menos clones, baja m y afloja BH
  corr_threshold: 0.70
  corr_n_blocks: 5
  cluster_representative: spearman

  # STEP 3 — correr calibrate_runtime() antes de fijar shuffle_n_runs
  shuffle_n_runs: 300
  shuffle_alpha: 0.05
  shuffle_block_size: 0           # 0 = auto por ACF del target
  shuffle_sample_size: 2000
  shuffle_boost_rounds: 150
  shuffle_n_real_seeds: 5
  significance_method: zscore     # "parametric_bh" | "empirical_bh" | "zscore"
  parametric_dist: lognormal
  require_empirical_floor: true
  zscore_threshold: 4.0
  robustness_pass: false

  # STEP 4
  run_stability_filter: true
  stability_n_windows: 5
  stability_min_score: 0.15
  stability_penalty_k: 0.5

  # STEP 5 — no desactivar: sin el control aleatorio no se sabe si la
  # seleccion aporta senal o solo reduccion de dimension.
  run_validation: true
  validation_random_seeds: 3

# ── Analisis de error ─────────────────────────────────────────────────────────
error_analysis:
  k_max: 6
  tail_percentile: 95.0
  lambda_bins: [1.5, 2.5, 3.5, 4.5, 5.5, 6.5, 7.5, 8.5, 9.5, 10.5, 11.5, 12.5, 13.5, 14.5]
  min_matches_per_league: 20
  top_n_leagues: 20
  rolling_window: 3
  league_column: tournament
  # Primera columna que exista se usa para el analisis de drift temporal.
  temporal_columns: [year_month, matchweek, date, match_date, season_week]

# ── Rutas (opcional) ──────────────────────────────────────────────────────────
# Si se omiten, se derivan de 'target.name':
#   configs_dir -> configs/<name>/
#   metrics_dir -> outputs/clubs/model_metrics/<name>/
#   models_dir  -> outputs/clubs/models/<name>/
paths: {}
